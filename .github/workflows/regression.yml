# Regression tests of pgCluu
#
# - offline: all tests of t/ on the fixtures (statistics collected on
#   PostgreSQL 16, 17 and 18), no PostgreSQL server needed. The live test
#   t/09_collectd_live.t is skipped.
# - live: collect with pgcluu_collectd on a PostgreSQL server for each
#   supported major version, then report generation (t/09_collectd_live.t).

name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline tests (fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CGI.pm is installed only when the runner image does not provide it.
      # The Ubuntu mirrors can be unreachable for a while, the download is
      # retried by apt and the whole installation three times.
      - name: Install dependencies
        run: |
          if perl -MCGI -e 1 2>/dev/null; then
            echo "CGI.pm found: $(perl -MCGI -e 'print $CGI::VERSION')"
          else
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update -qq &&
              sudo apt-get -o Acquire::Retries=5 install -y -qq libcgi-pm-perl && break
              [ $i -eq 3 ] && exit 1
              echo "apt-get failed, new attempt in 60 seconds"
              sleep 60
            done
          fi

      - name: Versions
        run: |
          perl -v | head -2
          node --version

      - name: Run tests
        run: |
          perl Makefile.PL
          make
          make test TEST_VERBOSE=0


  live:
    name: Live collect on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # -U: without it pg_isready connects as root and the server logs
        # 'role "root" does not exist' at each check
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGCLUU_TEST_LIVE: 1
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # psql, used by pgcluu_collectd and the test, is installed only when
      # the runner image does not provide it. The Ubuntu mirrors can be
      # unreachable for a while, the download is retried by apt and the
      # whole installation three times.
      - name: Install dependencies
        run: |
          if command -v psql >/dev/null; then
            echo "psql found: $(psql --version)"
          else
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 update -qq &&
              sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client && break
              [ $i -eq 3 ] && exit 1
              echo "apt-get failed, new attempt in 60 seconds"
              sleep 60
            done
          fi

      - name: Server version
        run: psql -X -At -c 'SELECT version()'

      - name: Run live test
        run: prove -v t/09_collectd_live.t
